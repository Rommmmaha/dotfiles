$customConfigPath = "$HOME/.config/hypr/custom"
# =======================================================================================
# Device & Display
# =======================================================================================
input:sensitivity = -0.5
monitorv2 {
    output = DP-1
    mode = 1920x1080@144
    position = 0x0
    bitdepth = 8
    vrr = true
    #icc = /home/r/24GN600.icm
    # Player 1 | Gamma 1 | R/G/B = 50/46/45
}
misc:vrr = true
# =======================================================================================
# Autostart
# =======================================================================================
exec-once = hyprctl dispatch workspace 2
exec-once = rm -rf "$HOME/.config/obs-studio/.sentinel"
exec-once = [workspace 1 silent] Telegram
exec-once = [workspace 1 silent] equibop
exec-once = [workspace 3 silent] zen-browser
exec-once = steam -silent
exec-once = gpu-screen-recorder -w screen -f 60 -a X1.monitor -c mkv -bm qp -q ultra -tune quality -r 90 -o /mnt/Data/Clips;notify-send "gpu-screen-recorder died"
exec-once = r_sndcpy.py
exec-once = r_overlay --udp 7435
# =======================================================================================
# Keybinds
# =======================================================================================
bind = SUPER, F2, exec, pkill -SIGUSR1 -f gpu-screen-recorder
bindi = , mouse:276, exec, r_multitool cycle
bindi = , mouse:275, exec, r_multitool ptt 1
bindir = , mouse:275, exec, r_multitool ptt 0
bindpl = SUPER, mouse_up, exec, r_multitool vol 2%-
bindpl = SUPER, mouse_down, exec, r_multitool vol 2%+